<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الدردشة</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <div class="app">
        <aside id="usersList">
            <h1 id="roomName">الغرفة</h1>
            <h2>المتصلون الآن</h2>
            <!-- أسماء تجريبية: ستُستبدل بقائمة حقيقية من السيرفر في مهمة لاحقة -->
            <ul id="userListItems">
                <li>مصطفى</li>
                <li>محمد</li>
                <li>أحمد</li>
                <li>محمود</li>
            </ul>
            <a class="leave" href="index.html">مغادرة الغرفة</a>
        </aside>

        <main class="chat">
            <div id="messages">
                <div id="messageList"></div>
            </div>

            <form id="messageForm">
                <input type="text" id="messageInput" placeholder="اكتب رسالة..." autocomplete="off" required>
                <button type="submit" class="send" aria-label="إرسال">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M22 2 11 13"></path>
                        <path d="M22 2 15 22l-4-9-9-4 20-7z"></path>
                    </svg>
                </button>
            </form>
        </main>
    </div>

    <script>
        // عرض اسم الغرفة اللي اختارها المستخدم (شكل فقط، السيرفر لسه ما يعرفش الغرفة)
        try {
            const room = localStorage.getItem('room');
            if (room) document.getElementById('roomName').textContent = room;
        } catch (e) {}
    </script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="./js/script.js"></script>
</body>
</html>
