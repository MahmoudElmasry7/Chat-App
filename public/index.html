<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الدخول إلى الدردشة</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body class="join">
    <main class="join-card">
        <header class="join-head">
            <h1>غرف الدردشة</h1>
            <p>اختر اسمك وغرفة، وابدأ الحديث مباشرة.</p>
        </header>

        <form id="joinForm">
            <label for="username">اسم المستخدم</label>
            <input type="text" id="username" placeholder="مثال: محمود" autocomplete="off" required>

            <label for="room">الغرفة</label>
            <select id="room" required>
                <option value="">اختر غرفة</option>
                <option value="مجتمع المبرمجين">مقهى الأفكار</option>
                <option value="دردشة الأصدقاء">دردشة الأصدقاء</option>
                <option value="جروب العيلة">مجموعة المرح</option>
                <option value="جروب الشغل">عالم الإبداع</option>
            </select>

            <button type="submit" class="btn-primary">انضم إلى الغرفة</button>
        </form>
    </main>

    <script src="./js/index.js"></script>
</body>
</html>
